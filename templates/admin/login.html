<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Dulce Malia</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
</head>
<body style="background: linear-gradient(135deg, var(--crema), var(--rosa-claro)); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">

<div style="background:white; border-radius:var(--radio-lg); padding:48px 40px; width:100%; max-width:400px; box-shadow:var(--sombra-media); text-align:center;">

  <div style="font-size:3rem; margin-bottom:8px;">🎂</div>
  <h1 style="font-family:'Playfair Display',serif; font-size:1.6rem; color:var(--chocolate); margin-bottom:4px;">Panel Admin</h1>
  <p style="font-size:0.88rem; color:var(--texto-claro); margin-bottom:32px;">Dulce Malia · Pastelería</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
<div class="alert alert-{{ category }}" style="padding: 12px 16px; border-radius: var(--radio); margin-bottom: 20px; font-size: 0.9rem;"></div>
    {{ message }}
    </div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="/admin/login">
    <div class="form-grupo" style="text-align:left;">
      <label>Usuario</label>
      <input type="text" name="usuario" placeholder="admin" required autofocus>
    </div>
    <div class="form-grupo" style="text-align:left;">
      <label>Contraseña</label>
      <input type="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px;">
      🔐 Ingresar al Panel
    </button>
  </form>

  <p style="margin-top:24px; font-size:0.82rem; color:var(--texto-claro);">
    Usuario por defecto: <strong>admin</strong> / <strong>dulcemalia2024</strong>
  </p>
  <a href="/" style="display:block; margin-top:12px; font-size:0.85rem; color:var(--rosa-oscuro);">← Volver a la tienda</a>
</div>

</body>
</html>
